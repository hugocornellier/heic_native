name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Format, Analyze & Unit Tests ───

  format-analyze-test:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze root package
        run: flutter analyze --fatal-infos .

      - name: Analyze example app
        run: flutter analyze --fatal-infos .
        working-directory: example

      - name: Run unit tests
        run: flutter test

  # ─── Build Jobs ───

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.18.1" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" || true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('example/android/**/*.gradle*', 'android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK (debug)
        run: flutter build apk --debug
        working-directory: example

  build-ios:
    name: Build iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: example/ios/Pods
          key: pods-ios-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: pods-ios-

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign
        working-directory: example

  build-macos:
    name: Build macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build macOS
        run: flutter build macos --debug
        working-directory: example

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libheif-dev libpng-dev \
            clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Linux
        run: flutter build linux --debug
        working-directory: example

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Build against the committed windows/third_party DLLs, the bytes pub.dev
      # ships. A libde265 rebuilt by vcpkg with the windows-latest compiler
      # (VS 2026) crashes in de265_init when heif.dll loads, so the app never
      # starts. The committed build does not.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows
        run: flutter build windows --debug
        working-directory: example

  # ─── Integration Tests ───

  integration-android:
    name: Integration Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.18.1" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" || true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('example/android/**/*.gradle*', 'android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: example
          # flutter test starts the app right after it installs it. On a fresh
          # install, an emulator still busy after its first boot can handle
          # the install broadcast seconds later and recreate the activity
          # under the running test: a second Flutter engine starts, and
          # flutter test then waits without end (at test 15, "convert and
          # convertToBytes produce same PNG", until the job timeout; 4 of 80
          # runs in run 43274502299, every one with two engine starts). So the
          # debug APK is built and installed first, and the script waits until
          # no install is under way and the broadcast queue has drained (the
          # same wait as flutter_litert's CI). flutter test's own install is
          # then an update of an app whose install broadcasts were already
          # handled. 130 of 130 runs passed this way (run 43278336149).
          # One line on purpose: the action runs each script line as its own
          # sh command, which tears a multi-line loop apart.
          script: >-
            bash -c 'set -e;
            flutter build apk --debug;
            adb -s emulator-5554 install -r build/app/outputs/flutter-apk/app-debug.apk;
            for i in $(seq 1 36); do
            [ "$(adb -s emulator-5554 shell dumpsys package installs | sed -n "/Active install sessions/,/Finalized install sessions/p" | grep -c mCommitted=true)" = 0 ] && break;
            echo "waiting for an install that is under way"; sleep 5; done;
            timeout 300 adb -s emulator-5554 shell am wait-for-broadcast-idle;
            flutter test integration_test/ -d emulator-5554'

  integration-ios:
    name: Integration iOS
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: example/ios/Pods
          key: pods-ios-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: pods-ios-

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Install GNU coreutils
        run: |
          brew install coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Create and boot iOS simulator
        run: |
          # Create a dedicated simulator to avoid stale runtime state from
          # reusing a pre-existing device.
          RUNTIME=$(xcrun simctl list runtimes available -j | \
            python3 -c "import sys,json; rts=json.load(sys.stdin)['runtimes']; print(next(r['identifier'] for r in reversed(rts) if 'iOS' in r['name']))")
          DEVICE_ID=$(xcrun simctl create "heic_native-ci" "iPhone 16" "$RUNTIME")
          xcrun simctl boot "$DEVICE_ID"
          # Block until the simulator is fully booted.
          xcrun simctl bootstatus "$DEVICE_ID" -b
          # Launch Simulator.app so the UI runloop is active, avoids
          # a race where flutter test installs the app before the
          # runtime is ready to accept debug connections.
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID"
          # Warm the runtime by launching a system app. This ensures
          # SpringBoard and the debug services are fully initialized.
          xcrun simctl launch "$DEVICE_ID" com.apple.Preferences || true
          sleep 5
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Pre-warm iOS build
        run: flutter build ios --debug --no-codesign --simulator
        working-directory: example

      # flutter test on iOS simulators can hang indefinitely waiting for
      # the Dart VM Service connection (simulators.dart has no timeout on
      # that await). Use a retry loop with process cleanup and simulator
      # reboot, same defensive pattern as the macOS job.
      # Every command in the loop is bounded so the step's own timeout is
      # never reached: a hit step timeout kills the job with no retry and
      # no diagnostics (CI on main, 2026-06-30).
      - name: Run integration tests on iOS simulator
        working-directory: example
        timeout-minutes: 50
        run: |
          set -e
          MAX_ATTEMPTS=3
          # Shut the simulator down, erase it and boot it again. The first
          # boot after an erase can take over three minutes on these runners,
          # so bootstatus gets seven. A reboot that still fails is reported
          # and the next attempt runs anyway, so the step ends with the
          # loop's own report rather than set -e or the step timeout.
          reboot_simulator() {
            timeout -k 10 60 xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
            timeout -k 10 60 xcrun simctl erase "$DEVICE_ID" 2>/dev/null || true
            sleep 2
            timeout -k 10 60 xcrun simctl boot "$DEVICE_ID" || return 1
            timeout -k 10 420 xcrun simctl bootstatus "$DEVICE_ID" -b || return 1
            open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID"
            timeout -k 10 60 xcrun simctl launch "$DEVICE_ID" com.apple.Preferences || true
            sleep 5
          }
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "========================================="
            echo "Attempt $attempt of $MAX_ATTEMPTS"
            echo "========================================="
            # Kill any leftover app/flutter processes from prior attempts.
            pkill -9 -f "Runner" 2>/dev/null || true
            pkill -9 -f "Flutter" 2>/dev/null || true
            sleep 2
            # Bound each attempt so a hung VM connection is killed and
            # retried rather than burning the whole step. The first
            # flutter test of a job, and the first after a simulator erase,
            # spends up to three minutes building and installing the app
            # before any test runs, so four minutes killed healthy attempts.
            # Each attempt gets seven.
            LOG_FILE="$RUNNER_TEMP/ios_test_attempt_${attempt}.log"
            set +e
            timeout -k 20 420 flutter test integration_test/ -d "$DEVICE_ID" \
              --no-pub --reporter expanded 2>&1 | tee "$LOG_FILE"
            EXIT_CODE=${PIPESTATUS[0]}
            set -e
            if [ "$EXIT_CODE" -eq 0 ] && grep -qE "(All tests passed|[1-9][0-9]* tests? passed\.)" "$LOG_FILE"; then
              echo "Tests passed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed (exit code $EXIT_CODE)."
            # If tests actually ran and reported failures, don't retry.
            if grep -qE "Some tests failed" "$LOG_FILE" 2>/dev/null; then
              echo "Tests ran but had failures, not retrying."
              exit 1
            fi
            echo "No test output or VM connection hang."
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi
            # Reboot the simulator for a clean slate, then retry.
            REBOOT_START=$SECONDS
            if reboot_simulator; then
              echo "Simulator rebooted in $((SECONDS - REBOOT_START)) s. Retrying..."
            else
              echo "::warning::Simulator reboot did not finish in $((SECONDS - REBOOT_START)) s. Retrying anyway..."
            fi
          done
          echo "All $MAX_ATTEMPTS attempts failed."
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "--- Attempt $i output ---"
            cat "$RUNNER_TEMP/ios_test_attempt_${i}.log" 2>/dev/null || true
          done
          exit 1

      - name: Delete dedicated iOS simulator
        if: always()
        run: |
          if [ -n "${DEVICE_ID:-}" ]; then
            xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
            xcrun simctl delete "$DEVICE_ID" 2>/dev/null || true
          fi

  integration-macos:
    name: Integration macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      # Flutter desktop test runner bug: run test files one at a time
      # with process kills between runs to avoid "Failed to foreground
      # app" / "Error waiting for a debug connection" errors.
      - name: Run integration tests
        working-directory: example
        run: |
          set -e
          TEST_FILES=(
            plugin_integration_test.dart
          )
          FAILED=()
          for f in "${TEST_FILES[@]}"; do
            echo "========================================="
            echo "Running: $f"
            echo "========================================="
            pkill -9 -f "heic_native_example" 2>/dev/null || true
            sleep 2
            OUTPUT=$(flutter test "integration_test/$f" -d macos 2>&1) || true
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "Some tests failed" || \
               ! echo "$OUTPUT" | grep -qE "(All tests passed|[1-9][0-9]* tests? passed\.)"; then
              FAILED+=("$f")
              echo "::error::FAILED: $f"
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "========================================="
            echo "FAILED TESTS:"
            printf '  - %s\n' "${FAILED[@]}"
            echo "========================================="
            exit 1
          fi
          echo "All ${#TEST_FILES[@]} test files passed."

  integration-linux:
    name: Integration Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libheif-dev libpng-dev \
            clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Start Xvfb
        run: |
          /usr/bin/Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX +render -noreset &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "GDK_BACKEND=x11" >> "$GITHUB_ENV"

      - name: Run integration tests
        working-directory: example
        run: |
          set -e
          TEST_FILES=(
            plugin_integration_test.dart
          )
          FAILED=()
          for f in "${TEST_FILES[@]}"; do
            echo "========================================="
            echo "Running: $f"
            echo "========================================="
            pkill -9 -f "heic_native_example" 2>/dev/null || true
            sleep 2
            flutter test "integration_test/$f" -d linux 2>&1 | tee "$RUNNER_TEMP/$f.log" || true
            if grep -q "Some tests failed" "$RUNNER_TEMP/$f.log" || \
               ! grep -qE "(All tests passed|[1-9][0-9]* tests? passed\.)" "$RUNNER_TEMP/$f.log"; then
              FAILED+=("$f")
              echo "::error::FAILED: $f"
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "========================================="
            echo "FAILED TESTS:"
            printf '  - %s\n' "${FAILED[@]}"
            echo "========================================="
            for f in "${FAILED[@]}"; do
              echo ""
              echo "--- Output for $f ---"
              cat "$RUNNER_TEMP/$f.log"
            done
            exit 1
          fi
          echo "All ${#TEST_FILES[@]} test files passed."

  integration-windows:
    name: Integration Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Build against the committed windows/third_party DLLs, the bytes pub.dev
      # ships. A libde265 rebuilt by vcpkg with the windows-latest compiler
      # (VS 2026) crashes in de265_init when heif.dll loads, so the app never
      # starts. The committed build does not.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Run integration tests
        working-directory: example
        shell: bash
        run: |
          set -e
          TEST_FILES=(
            plugin_integration_test.dart
          )
          FAILED=()
          for f in "${TEST_FILES[@]}"; do
            echo "========================================="
            echo "Running: $f"
            echo "========================================="
            taskkill //F //IM "heic_native_example.exe" 2>/dev/null || true
            sleep 2
            OUTPUT=$(flutter test "integration_test/$f" -d windows 2>&1) || true
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "Some tests failed" || \
               ! echo "$OUTPUT" | grep -qE "(All tests passed|[1-9][0-9]* tests? passed\.)"; then
              FAILED+=("$f")
              echo "::error::FAILED: $f"
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "========================================="
            echo "FAILED TESTS:"
            printf '  - %s\n' "${FAILED[@]}"
            echo "========================================="
            exit 1
          fi
          echo "All ${#TEST_FILES[@]} test files passed."
