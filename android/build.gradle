group = "com.hugocornellier.heic_native"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// AGP 9 ships built-in Kotlin and rejects the legacy Kotlin Gradle Plugin
// ("The 'org.jetbrains.kotlin.android' plugin is no longer required ...").
// Apply KGP only on AGP < 9; on AGP >= 9 built-in Kotlin compiles the sources.
// Declaring it here (even guarded) also stops the Flutter Gradle plugin from
// auto-applying KGP to this module, which AGP 9 would otherwise reject.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    apply plugin: "kotlin-android"
}

android {
    namespace = "com.hugocornellier.heic_native"
    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }


    defaultConfig {
        minSdk = 28
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_static"
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }
}

dependencies {
}


// Pin the Kotlin JVM target to match Java when a Kotlin compile task exists
// (legacy KGP on AGP < 9, or built-in Kotlin on AGP >= 9). Guarded so an AGP 9
// setup without built-in Kotlin (no kotlin extension) is skipped instead of
// erroring on the kotlin {} DSL.
if (project.extensions.findByName("kotlin") != null) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
}
